<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — The Saturno Project</title>
<meta name="description" content="Every post, devlog, and series from The Saturno Project — searchable, sortable, and browsable by series.">
<link rel="canonical" href="https://saturnoproject.com/blog/">
<link rel="icon" type="image/svg+xml" href="../images/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Saturno Project">
<meta property="og:title" content="Blog — The Saturno Project">
<meta property="og:description" content="Every post, devlog, and series from The Saturno Project — searchable, sortable, and browsable by series.">
<meta property="og:url" content="https://saturnoproject.com/blog/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Blog — The Saturno Project">
<meta name="twitter:description" content="Every post, devlog, and series from The Saturno Project — searchable, sortable, and browsable by series.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../blog-zine.css">
<link rel="stylesheet" href="../blog-page.css">
<noscript><style>.fade-section { opacity: 1 !important; transform: none !important; }</style></noscript>
</head>
<body class="zine">

<a href="#main" class="skip-link">Skip to content</a>

<header class="site-header">
  <div class="wrap header-row">
    <a href="../index.html" class="wordmark"><img src="../images/logo.svg" alt="" class="wordmark-logo">THE SATURNO PROJECT</a>
    <nav aria-label="Primary">
      <a href="../index.html#about">About</a>
      <a href="index.html" aria-current="page">Blog</a>
      <a href="../index.html#creator">Creator</a>
      <a href="../index.html#contact">Contact</a>
      <a href="../index.html#legal" class="legal-link">Legal</a>
    </nav>
  </div>
</header>

<main id="main">

  <section class="blog-hero">
    <div class="blog-hero-watermark" aria-hidden="true">
      <img src="../images/logo.svg" alt="">
    </div>
    <div class="blog-hero-content">
      <p class="blog-hero-kicker">The Saturno Project</p>
      <h1 class="blog-hero-title">Blog</h1>
    </div>
    <span class="blog-hero-scroll-cue" aria-hidden="true"></span>
  </section>

  <section class="series-showcase" id="series-showcase" aria-label="Series">
    <div class="wrap">
      <h2 class="section-title fade-section">Series</h2>
      <div id="series-list"><!-- Populated by blog-page.js from posts-index.json --></div>
    </div>
  </section>

  <section class="blog-library" id="library" aria-label="Every post">
    <div class="wrap">
      <h2 class="section-title fade-section">Every Post</h2>

      <div class="library-controls">
        <input type="search" id="library-search" class="zine-search" placeholder="Search posts&hellip;" aria-label="Search posts">
        <div class="library-sort">
          <label for="library-sort-select">Sort by</label>
          <select id="library-sort-select">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="title">Title (A&ndash;Z)</option>
            <option value="series">Series</option>
          </select>
        </div>
        <div class="zine-tags" id="library-tag-filter" role="group" aria-label="Filter by tag">
          <button class="zine-tag-btn is-active" data-tag="all" type="button">
            <span class="zine-tag-circle">&#9733;</span>
            <span class="zine-tag-label">all</span>
          </button>
        </div>
      </div>

      <div id="library-grid" class="book-grid" aria-live="polite">
        <!-- Populated by blog-page.js from posts-index.json -->
      </div>

      <p class="zine-empty-state" id="library-empty" hidden>No posts match your search or filter.</p>
    </div>
  </section>

</main>

<footer class="site-footer wrap">
  <p>&copy; 2026 Roberto Jimenez-Martinez</p>
  <nav aria-label="Footer">
    <a href="../index.html#legal">Legal &amp; Disclosures</a>
    <a href="../index.html#contact">Contact</a>
  </nav>
</footer>

<script src="../scroll-fade.js"></script>
<script src="../blog-page.js"></script>
</body>
</html>
