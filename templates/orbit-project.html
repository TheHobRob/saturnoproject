{{HEADER}}

  <div class="wrap" style="max-width:900px; padding-top:48px;">
    <p class="zine-byline fade-section">{{STATUS}}</p>
    <h1 class="zine-post-title fade-section">{{TITLE}}</h1>
    <p class="intro-lead fade-section">{{TAGLINE}}</p>
    <p class="project-tags fade-section">{{TAGS}}</p>
    <div class="contact-buttons fade-section">
      {{DEMO_LINK}}
      {{REPO_LINK}}
      {{SERIES_LINK}}
    </div>
  </div>

  <div class="zine-hero-image fade-section" style="background-image:url('{{HERO_IMAGE_SRC}}'); background-size:auto 100%; background-repeat:no-repeat; background-position:center;" role="img" aria-label="{{HERO_IMAGE_ALT}}"></div>

  <div class="zine-post-body">
{{DESCRIPTION}}
  </div>

  <a href="index.html" class="post-back-link">&larr; Back to Orbit</a>
