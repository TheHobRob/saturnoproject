<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ring Runner — The Saturno Project</title>
<meta name="description" content="Ring Runner: side-scrolling action along Saturn's rings. A playable prototype from The Saturno Project's Orbit console.">
<link rel="canonical" href="https://saturnoproject.com/orbit/ring-runner/">
<link rel="icon" type="image/svg+xml" href="../../images/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../../images/favicon-32.png">
<link rel="apple-touch-icon" href="../../images/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Saturno Project">
<meta property="og:title" content="Ring Runner — The Saturno Project">
<meta property="og:description" content="Side-scrolling action along Saturn's rings. A playable prototype from Orbit.">
<meta property="og:url" content="https://saturnoproject.com/orbit/ring-runner/">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #2E2517;
  --paper: #F2ECDD;
  --glow: #8FA35E; /* dark-mode --signal */
}
html, body {
  margin: 0;
  height: 100%;
  background: var(--ink);
  color: var(--paper);
  overscroll-behavior: none;
}
body {
  height: 100dvh;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  font-family: 'Space Grotesk', system-ui, sans-serif;
}
.bar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 12px;
}
.power {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  border-radius: 50%;
  border: 3px solid var(--paper);
  background: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
}
.power img { display: block; width: 36px; height: auto; filter: drop-shadow(0 0 4px var(--glow)); }
.title {
  flex-grow: 1;
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 24px;
  font-weight: 700;
  line-height: 1.1;
}
.hint {
  display: block;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #E0D5B8; /* --rule */
}
#mute {
  min-height: 44px;
  padding: 0 16px;
  border: 3px solid var(--paper);
  border-radius: 10px;
  background: transparent;
  color: var(--paper);
  font: 700 13px 'Space Grotesk', sans-serif;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
}
a:focus-visible, button:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }
#game { flex: 1; min-height: 0; }
/* Orbit handoff: fade in from the console's ink after Start Game. */
@keyframes orbit-enter { from { opacity: 0; } }
.bar, #game { animation: orbit-enter 0.18s ease-out both; }
@media (prefers-reduced-motion: reduce) { .bar, #game { animation: none; } }

</style>
</head>
<body>
<header class="bar">
  <a class="power" href="../index.html?cart=ring-runner#console-section" aria-label="Power off and return to the Orbit console">
    <img src="../../images/logo.svg" alt="" width="36" height="36">
  </a>
  <div class="title">Ring Runner<span class="hint">Logo = power button</span></div>
  <button id="mute" type="button" aria-pressed="false">Sound on</button>
</header>
<main id="game"></main>

<script type="module">
  import { game } from './game.js';
  const btn = document.getElementById('mute');
  const sync = () => {
    btn.textContent = game.sfx.muted ? 'Sound off' : 'Sound on';
    btn.setAttribute('aria-pressed', String(game.sfx.muted));
  };
  btn.addEventListener('click', () => {
    game.sfx.setMuted(!game.sfx.muted);
    sync();
  });
  sync();
</script>
</body>
</html>
